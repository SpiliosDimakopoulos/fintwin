name: ci
# push only on main: a branch with a pull request is tested once, as the pull request
on: { push: { branches: [main] }, pull_request: {}, workflow_dispatch: {} }
# Least privilege: CI only reads the repository (also for pull requests from forks).
permissions: { contents: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # 3.11 is the oldest supported version (pyproject), 3.13 the newest we run the paper on
    strategy:
      fail-fast: false
      matrix: { python: ["3.11", "3.13"] }
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with: { version: "0.12.5" }
      - run: uv sync --locked --python ${{ matrix.python }}
      - name: Lint (ruff)
        run: uv run ruff check fintwin tests scripts && uv run ruff format --check fintwin tests
      - name: Shell scripts (shellcheck is preinstalled on the runner; SC2164 cd-without-exit, SC2054 the comma in --cutoffs)
        run: shellcheck -x -S warning -e SC2164,SC2054 scripts/*.sh ../scripts/*.sh
      - name: Type check (mypy)
        run: uv run mypy fintwin
      - name: Scripts parse on the oldest supported Python (e.g. no 3.12-only f-string syntax)
        run: uv run python -m compileall -q scripts
      - name: Tests with coverage (the gate, fail_under, is in pyproject.toml and includes the research code)
        run: uv run pytest -q --cov=fintwin --cov-report=term
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test           # includes Python <-> TypeScript parity on golden runs
      - run: npm run build
