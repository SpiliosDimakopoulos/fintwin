name: ci
on: [push, pull_request, workflow_dispatch]
jobs:
  engine:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync
      - name: Lint (ruff)
        run: uv run ruff check fintwin tests && uv run ruff format --check fintwin tests
      - name: Type check (mypy)
        run: uv run mypy fintwin
      - name: Tests with coverage
        run: uv run pytest -q --cov=fintwin --cov-report=term --cov-fail-under=85
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm test           # includes Python <-> TypeScript parity on golden runs
      - run: npm run build
