# Deploy the dashboard on every push. The data comes from the latest successful weekly data build (artifact
# "site-data"), so code changes never roll the site back to the older snapshot committed in the repo.
name: pages
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: read, pages: write, id-token: write, actions: read }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v7
      - name: Use the freshest data build if there is one
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow data.yml --status success --limit 1 --json databaseId -q '.[0].databaseId' || true)
          if [ -n "$run_id" ] && gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n site-data -D /tmp/site-data; then
            rsync -a /tmp/site-data/ web/public/data/
            echo "data from run $run_id"
          else
            echo "no data build yet; using the committed snapshot"
          fi
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with: { path: web/dist }
      - uses: actions/deploy-pages@v5
