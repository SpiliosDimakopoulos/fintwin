# Recompute the paper's statistics from the per-company outputs of an earlier `research` run, with the current code.
name: research-stats
on:
  workflow_dispatch:
    inputs:
      run_id: { description: "ID of the research run whose shard outputs to use", required: true }
permissions: { contents: read, actions: read }
jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults: { run: { working-directory: engine } }
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Download the shard outputs
        env: { GH_TOKEN: "${{ github.token }}" }
        # the merged outputs if that run's stats job finished, otherwise the 16 shard artifacts
        run: |
          mkdir -p .cache/research
          if gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -n research-results -D /tmp/rr; then
            cp -r /tmp/rr/engine/.cache/research/. .cache/research/
          else
            gh run download "${{ inputs.run_id }}" -R "$GITHUB_REPOSITORY" -p "research-[0-9]*" -D /tmp/shards
            find /tmp/shards -name "*.json" -exec cp {} .cache/research/ \;
          fi
          ls .cache/research | wc -l
      - run: uv sync && uv run python -m fintwin.research stats
      - uses: actions/upload-artifact@v7
        with: { name: research-stats, path: docs/paper/research.json }
      - uses: actions/upload-artifact@v7
        with: { name: research-results, include-hidden-files: true, path: engine/.cache/research/ }
