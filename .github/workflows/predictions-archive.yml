# Prospective track (growth plan B4): after each weekly `data` run, freeze the model's forward-looking scores in a
# GitHub release `predictions-YYYY-WW` BEFORE any outcome is known.
#
# What is evidence of timing, and what is not (be precise):
#   - NOT evidence: `built_at_utc` in the files (self-declared), the release `created_at` (it is the tagged commit's
#     date, which an author can set), and the tag itself (lightweight tag: it has no date of its own).
#   - Evidence 1: the release `published_at` field of the REST API (set server-side by GitHub at publish time).
#   - Evidence 2 (independent of GitHub): an OpenTimestamps proof of the manifest's SHA256, anchored in the Bitcoin
#     chain, attached as manifest_<week>.json.ots. Chosen over Sigstore/Rekor because it needs no identity token
#     (no id-token permission), no account and no third-party service staying alive; it only needs the calendar
#     servers once. The proof is "pending" at first; `ots upgrade` (run later, from anywhere) makes it self-contained.
#     Upgraded proofs cannot replace the asset on an immutable release: store them in a mutable place (e.g. an
#     `ots-upgrades` release or branch) or just run `ots upgrade` when verifying.
#   - Evidence 3: the hash chain. Each manifest holds prev_sha256 of the previous week's manifest, fetched from the
#     previous release, so a deleted or back-filled week breaks the chain. The first week says prev = null.
#   - The manifest also carries the tree hash of all input files, the git SHA and the input zip is attached, so the
#     run can be audited after the 90-day artifact expiry.
# Verifying: `ots verify manifest_X.json.ots`, `sha256sum` the parquet against the manifest, compare published_at.
#
# One-time repository setup (maintainer): Settings > Rules > Rulesets > New tag ruleset
#   name "predictions tags"; Enforcement: Active; Target: tags matching `predictions-*`;
#   rules ON: Restrict deletions, Restrict updates, Block force pushes; leave Restrict creations OFF (the workflow must
#   create them); Bypass list: empty. Also enable Settings > General > "Immutable releases".
name: predictions-archive
on:
  workflow_run: { workflows: [data], types: [completed], branches: [main] }
  workflow_dispatch:
    inputs:
      first_week: { description: "true only for the very first archive (chain start, prev = null)", default: "false" }
concurrency: { group: predictions-archive, cancel-in-progress: false }
permissions: {}

jobs:
  build:
    # only after a successful weekly build (the data workflow already gates on MIN_COMPANIES)
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, actions: read }   # actions: read to download the data run's artifact
    outputs:
      week: "${{ steps.a.outputs.week }}"
      main_sha: "${{ steps.sha.outputs.sha }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (same pin as data.yml)
        with: { ref: main }
      - id: sha
        # main's tip now includes the commit the data job pushed after its run started; the release tags this one
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Weekly data of the run that triggered this (or the latest successful one)
        env:
          GH_TOKEN: "${{ github.token }}"
          TRIGGER_RUN_ID: "${{ github.event.workflow_run.id }}"
        run: |
          run_id="$TRIGGER_RUN_ID"
          [ -n "$run_id" ] || run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow data.yml --branch main --status success --limit 1 --json databaseId -q '.[0].databaseId')
          gh run download "$run_id" -R "$GITHUB_REPOSITORY" -n site-data -D /tmp/site-data
      - name: Previous week's manifest (hash chain)
        id: prev
        env:
          GH_TOKEN: "${{ github.token }}"
          FIRST: "${{ inputs.first_week }}"
        run: |
          # paginate through ALL releases (no cap); tag names sort lexically in YYYY-WW order
          prev=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '.[].tag_name | select(startswith("predictions-"))' | sort | tail -n 1)
          if [ -n "$prev" ]; then
            mkdir -p /tmp/prev && gh release download "$prev" -R "$GITHUB_REPOSITORY" -p 'manifest_*.json' -D /tmp/prev
            echo "args=--prev-manifest $(ls /tmp/prev/manifest_*.json)" >> "$GITHUB_OUTPUT"
          elif [ "$FIRST" = "true" ]; then
            echo "args=--first" >> "$GITHUB_OUTPUT"
          else
            echo "no previous predictions-* release and first_week is not set: refusing to start a new chain" >&2
            exit 1
          fi
      - id: a
        name: Archive (pyarrow is added for this step only, pinned; it is not an engine dependency)
        working-directory: engine
        env: { GIT_SHA: "${{ steps.sha.outputs.sha }}", PREV_ARGS: "${{ steps.prev.outputs.args }}" }
        run: |
          # pandas comes from engine/uv.lock; pyarrow is pinned here and recorded in the manifest
          uv run --with pyarrow==26.0.1 python scripts/archive_predictions.py \
            --data /tmp/site-data --out ../predictions_archive --git-sha "$GIT_SHA" $PREV_ARGS
          echo "week=$(basename ../predictions_archive/manifest_*.json .json | sed 's/manifest_//')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: predictions, path: predictions_archive/, if-no-files-found: error }

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions: { contents: write }   # the only job that can write releases; it runs no repository code; no id-token
    outputs: { ots: "${{ steps.stamp.outputs.ots }}" }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { name: predictions, path: out }
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Anchor the manifest hash externally (OpenTimestamps)
        id: stamp
        env: { WEEK: "${{ needs.build.outputs.week }}" }
        run: |
          # Pinned version via uv (MAINTAINER TODO: replace by `pip install --require-hashes -r ots-requirements.txt`
          # generated with `uv pip compile --generate-hashes`, once the file is reviewed and committed).
          # A failure must not lose the week: the release still carries published_at; stamp manually later (see doc).
          if uvx --from opentimestamps-client==0.7.2 ots stamp "out/manifest_$WEEK.json" && [ -f "out/manifest_$WEEK.json.ots" ]; then
            echo "ots=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ots=no" >> "$GITHUB_OUTPUT"
            echo "::warning::ots stamp failed for $WEEK; the release will have no external anchor (published_at only)"
          fi
      - name: Create the release (never overwrite)
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
          WEEK: "${{ needs.build.outputs.week }}"
          SHA: "${{ needs.build.outputs.main_sha }}"
          OTS: "${{ steps.stamp.outputs.ots }}"
        run: |
          tag="predictions-$WEEK"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists; archives are immutable, refusing to touch it" >&2
            exit 1
          fi
          sha=$(python3 -c "import json;print(json.load(open('out/manifest_$WEEK.json'))['sha256'])")
          assets=("out/predictions_$WEEK.parquet" "out/manifest_$WEEK.json" "out/inputs_$WEEK.zip")
          if [ "$OTS" = "yes" ]; then
            assets+=("out/manifest_$WEEK.json.ots")
            ev="Evidence of timing: this release's published_at and the attached .ots proof (not created_at)."
          else
            ev="Evidence of timing: this release's published_at ONLY. The OpenTimestamps stamp failed; see issue label ots-missing."
          fi
          gh release create "$tag" "${assets[@]}" --target "$SHA" --latest=false --title "Predictions $WEEK"             --notes "Prospective-track archive for ISO week $WEEK. parquet SHA256: $sha. $ev See docs/growth/B4_PROSPECTIVE.md."

  alert:
    # open an issue when the external anchor is missing; separate job so only it can write issues
    needs: [build, release]
    if: ${{ needs.release.outputs.ots == 'no' }}
    runs-on: ubuntu-latest
    permissions: { issues: write }
    steps:
      - env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}", WEEK: "${{ needs.build.outputs.week }}" }
        run: |
          gh label create ots-missing --color B60205 --description "OpenTimestamps stamp missing for a predictions release" || true
          gh issue create --label ots-missing --title "ots-missing: predictions-$WEEK"             --body "The OpenTimestamps stamp failed for predictions-$WEEK. Stamp manually (docs/growth/B4_PROSPECTIVE.md): download manifest_$WEEK.json, run ots stamp, then upload the .ots to the ots-upgrades release. A late stamp proves only the later date."
