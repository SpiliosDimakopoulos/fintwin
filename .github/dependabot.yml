version: 2
updates:
  - package-ecosystem: uv
    directory: /engine
    schedule: { interval: monthly }
    groups: { python: { patterns: ["*"] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: monthly }
    groups: { web: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { actions: { patterns: ["*"] } }
