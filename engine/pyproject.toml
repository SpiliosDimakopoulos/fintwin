[project]
name = "fintwin"
version = "0.1.0"
description = "Corporate financial health digital twin: SEC XBRL -> system dynamics -> Monte Carlo stress tests"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.31",
  "scipy>=1.11",
  "python-dotenv>=1.0",
  "statsmodels>=0.14",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
ai = [
    "anthropic>=0.70",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6.100",
    "matplotlib>=3.8",
    "lxml>=6.1.3",
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest-cov>=7.1.0",
    "fastapi>=0.110",
    "httpx2>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fintwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter wraps code; long prose strings stay readable

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = false

[tool.coverage.run]
# Network clients, the optional LLM memo, the optional local API and CLI orchestration are exercised by the
# weekly data workflow, not by unit tests; everything else is measured.
omit = ["fintwin/data/edgar.py", "fintwin/data/edgar_universe.py", "fintwin/data/fred.py", "fintwin/memo.py", "fintwin/api.py", "fintwin/pipeline.py",
        "fintwin/backtest/walk_forward.py", "fintwin/backtest/batch.py", "fintwin/research/experiments.py",
        "fintwin/research/__main__.py", "fintwin/research/assumption_sobol.py"]
